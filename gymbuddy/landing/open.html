<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open in FitnessSwipe</title>
  <meta name="description" content="This link opens in the FitnessSwipe app. Download the app and join.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1b2e; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .box { max-width: 430px; }
    .logo { font-size: 24px; font-weight: 800; margin-bottom: 26px; }
    .logo span { color: #94e336; }
    .icon { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 26px; font-weight: 800; margin-bottom: 10px; }
    p { color: rgba(255,255,255,0.6); margin-bottom: 28px; }
    .btn { display: block; background: #94e336; color: #0d1b2e; font-weight: 800; font-size: 16px; padding: 15px; border-radius: 16px; text-decoration: none; margin-bottom: 10px; }
    .btn.ghost { background: #1a2a44; color: #fff; border: 1px solid rgba(255,255,255,0.12); }
    .note { font-size: 12.5px; color: rgba(255,255,255,0.35); margin-top: 18px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">Fitness<span>Swipe</span></div>
    <div class="icon" id="icon">💪</div>
    <h1 id="title">Open in the app</h1>
    <p id="desc">This link leads to content in the FitnessSwipe app.</p>
    <a class="btn" id="openBtn" href="#">Open in the app</a>
    <a class="btn ghost" id="playBtn" href="https://play.google.com/apps/testing/com.fitnessswipe.app">Get it on Google Play (testing)</a>
    <p class="note" id="note">Already have the app? The link should open in it automatically.<br>App Store — coming soon.</p>
  </div>
  <script>
    (function () {
      var I18N = {
        en: { docTitle: 'Open in FitnessSwipe', open: 'Open in the app', defTitle: 'Open in the app', defDesc: 'This link leads to content in the FitnessSwipe app.', chTitle: 'Challenge invitation', chDesc: 'Join the challenge in the FitnessSwipe app and track progress together.', evTitle: 'Event invitation', evDesc: 'Sign up for a sports event in the FitnessSwipe app.', trTitle: 'Trainer profile', trDesc: 'See specialties, reviews and contact the trainer in the FitnessSwipe app.', refTitle: 'Invitation from a friend', refDesc: function (code) { return 'Sign up with code ' + code + ' and you both get 7 days of Premium!' }, play: 'Get it on Google Play (testing)', note: 'Already have the app? The link should open in it automatically.', soon: 'App Store — coming soon.' },
        pl: { docTitle: 'Otwórz w FitnessSwipe', open: 'Otwórz w aplikacji', defTitle: 'Otwórz w aplikacji', defDesc: 'Ten link prowadzi do treści w aplikacji FitnessSwipe.', chTitle: 'Zaproszenie do wyzwania', chDesc: 'Dołącz do wyzwania w aplikacji FitnessSwipe i śledź postęp razem z innymi.', evTitle: 'Zaproszenie na wydarzenie', evDesc: 'Zapisz się na wydarzenie sportowe w aplikacji FitnessSwipe.', trTitle: 'Wizytówka trenera', trDesc: 'Zobacz specjalizacje, opinie i skontaktuj się z trenerem w aplikacji FitnessSwipe.', refTitle: 'Zaproszenie od znajomego', refDesc: function (code) { return 'Zarejestruj się z kodem ' + code + ', a oboje dostaniecie 7 dni Premium!' }, play: 'Pobierz z Google Play (testy)', note: 'Masz już aplikację? Link powinien otworzyć się w niej automatycznie.', soon: 'App Store — wkrótce.' },
        de: { docTitle: 'In FitnessSwipe öffnen', open: 'In der App öffnen', defTitle: 'In der App öffnen', defDesc: 'Dieser Link führt zu Inhalten in der FitnessSwipe-App.', chTitle: 'Challenge-Einladung', chDesc: 'Tritt der Challenge in der FitnessSwipe-App bei und verfolgt den Fortschritt gemeinsam.', evTitle: 'Event-Einladung', evDesc: 'Melde dich in der FitnessSwipe-App für ein Sport-Event an.', trTitle: 'Trainerprofil', trDesc: 'Sieh dir Spezialisierungen und Bewertungen an und kontaktiere den Trainer in der FitnessSwipe-App.', refTitle: 'Einladung von einem Freund', refDesc: function (code) { return 'Registriere dich mit dem Code ' + code + ' und ihr bekommt beide 7 Tage Premium!' }, play: 'Bei Google Play holen (Test)', note: 'Hast du die App schon? Der Link sollte sich automatisch darin öffnen.', soon: 'App Store — bald verfügbar.' },
        fr: { docTitle: 'Ouvrir dans FitnessSwipe', open: 'Ouvrir dans l’app', defTitle: 'Ouvrir dans l’app', defDesc: 'Ce lien mène à du contenu dans l’app FitnessSwipe.', chTitle: 'Invitation à un défi', chDesc: 'Rejoins le défi dans l’app FitnessSwipe et suivez vos progrès ensemble.', evTitle: 'Invitation à un événement', evDesc: 'Inscris-toi à un événement sportif dans l’app FitnessSwipe.', trTitle: 'Profil du coach', trDesc: 'Découvre les spécialités, les avis et contacte le coach dans l’app FitnessSwipe.', refTitle: 'Invitation d’un ami', refDesc: function (code) { return 'Inscris-toi avec le code ' + code + ' et vous recevez tous les deux 7 jours de Premium !' }, play: 'Télécharger sur Google Play (test)', note: 'Tu as déjà l’app ? Le lien devrait s’y ouvrir automatiquement.', soon: 'App Store — bientôt.' },
        es: { docTitle: 'Abrir en FitnessSwipe', open: 'Abrir en la app', defTitle: 'Abrir en la app', defDesc: 'Este enlace lleva a contenido en la app FitnessSwipe.', chTitle: 'Invitación a un reto', chDesc: 'Únete al reto en la app FitnessSwipe y sigue el progreso junto a otros.', evTitle: 'Invitación a un evento', evDesc: 'Apúntate a un evento deportivo en la app FitnessSwipe.', trTitle: 'Perfil del entrenador', trDesc: 'Mira las especialidades, reseñas y contacta con el entrenador en la app FitnessSwipe.', refTitle: 'Invitación de un amigo', refDesc: function (code) { return '¡Regístrate con el código ' + code + ' y ambos recibiréis 7 días de Premium!' }, play: 'Descargar en Google Play (prueba)', note: '¿Ya tienes la app? El enlace debería abrirse en ella automáticamente.', soon: 'App Store — muy pronto.' },
        nl: { docTitle: 'Openen in FitnessSwipe', open: 'Openen in de app', defTitle: 'Openen in de app', defDesc: 'Deze link leidt naar content in de FitnessSwipe-app.', chTitle: 'Challenge-uitnodiging', chDesc: 'Doe mee met de challenge in de FitnessSwipe-app en volg samen de voortgang.', evTitle: 'Uitnodiging voor evenement', evDesc: 'Schrijf je in voor een sportevenement in de FitnessSwipe-app.', trTitle: 'Trainersprofiel', trDesc: 'Bekijk specialisaties en reviews en neem contact op met de trainer in de FitnessSwipe-app.', refTitle: 'Uitnodiging van een vriend', refDesc: function (code) { return 'Meld je aan met code ' + code + ' en jullie krijgen allebei 7 dagen Premium!' }, play: 'Downloaden via Google Play (test)', note: 'Heb je de app al? De link zou er automatisch in moeten openen.', soon: 'App Store — binnenkort.' },
        bg: { docTitle: 'Отвори във FitnessSwipe', open: 'Отвори в приложението', defTitle: 'Отвори в приложението', defDesc: 'Този линк води към съдържание в приложението FitnessSwipe.', chTitle: 'Покана за предизвикателство', chDesc: 'Включи се в предизвикателството в приложението FitnessSwipe и следете прогреса заедно.', evTitle: 'Покана за събитие', evDesc: 'Запиши се за спортно събитие в приложението FitnessSwipe.', trTitle: 'Профил на треньора', trDesc: 'Виж специалностите, отзивите и се свържи с треньора в приложението FitnessSwipe.', refTitle: 'Покана от приятел', refDesc: function (code) { return 'Регистрирай се с код ' + code + ' и двамата получавате 7 дни Premium!' }, play: 'Изтегли от Google Play (тест)', note: 'Вече имаш приложението? Линкът би трябвало да се отвори в него автоматично.', soon: 'App Store — скоро.' },
        ro: { docTitle: 'Deschide în FitnessSwipe', open: 'Deschide în aplicație', defTitle: 'Deschide în aplicație', defDesc: 'Acest link duce la conținut din aplicația FitnessSwipe.', chTitle: 'Invitație la o provocare', chDesc: 'Alătură-te provocării în aplicația FitnessSwipe și urmăriți progresul împreună.', evTitle: 'Invitație la un eveniment', evDesc: 'Înscrie-te la un eveniment sportiv în aplicația FitnessSwipe.', trTitle: 'Profilul antrenorului', trDesc: 'Vezi specializările, recenziile și contactează antrenorul în aplicația FitnessSwipe.', refTitle: 'Invitație de la un prieten', refDesc: function (code) { return 'Înregistrează-te cu codul ' + code + ' și amândoi primiți 7 zile de Premium!' }, play: 'Descarcă din Google Play (test)', note: 'Ai deja aplicația? Linkul ar trebui să se deschidă automat în ea.', soon: 'App Store — în curând.' },
        tr: { docTitle: 'FitnessSwipe’ta aç', open: 'Uygulamada aç', defTitle: 'Uygulamada aç', defDesc: 'Bu bağlantı FitnessSwipe uygulamasındaki içeriğe yönlendirir.', chTitle: 'Meydan okuma daveti', chDesc: 'FitnessSwipe uygulamasında meydan okumaya katıl ve ilerlemeyi birlikte takip edin.', evTitle: 'Etkinlik daveti', evDesc: 'FitnessSwipe uygulamasında bir spor etkinliğine kaydol.', trTitle: 'Antrenör profili', trDesc: 'Uzmanlık alanlarını ve yorumları gör, FitnessSwipe uygulamasında antrenörle iletişime geç.', refTitle: 'Bir arkadaştan davet', refDesc: function (code) { return code + ' koduyla kaydol, ikiniz de 7 gün Premium kazanın!' }, play: 'Google Play’den indir (test)', note: 'Uygulama zaten var mı? Bağlantı otomatik olarak uygulamada açılmalı.', soon: 'App Store — yakında.' },
      }

      var saved = null
      try { saved = localStorage.getItem('fs_lang') } catch (e) {}
      var browser = (navigator.language || 'en').slice(0, 2).toLowerCase()
      var lang = saved && I18N[saved] ? saved : (I18N[browser] ? browser : 'en')
      var t = I18N[lang]

      document.documentElement.lang = lang
      document.title = t.docTitle

      var path = location.pathname.replace(/^\/+/, '')
      var ref = new URLSearchParams(location.search).get('ref')
      var deepLink = 'fitnessswipe://' + path
      var icon = '💪', title = t.defTitle, desc = t.defDesc

      if (path.indexOf('challenge/') === 0) { icon = '🏆'; title = t.chTitle; desc = t.chDesc }
      else if (path.indexOf('event/') === 0) { icon = '📅'; title = t.evTitle; desc = t.evDesc }
      else if (path.indexOf('trainer/') === 0) { icon = '🥇'; title = t.trTitle; desc = t.trDesc }
      else if (ref) { icon = '🎁'; title = t.refTitle; desc = t.refDesc(ref); deepLink = 'fitnessswipe://?ref=' + encodeURIComponent(ref) }

      document.getElementById('icon').textContent = icon
      document.getElementById('title').textContent = title
      document.getElementById('desc').textContent = desc
      var btn = document.getElementById('openBtn')
      btn.textContent = t.open
      btn.href = deepLink
      document.getElementById('playBtn').textContent = t.play
      var note = document.getElementById('note')
      note.textContent = ''
      note.appendChild(document.createTextNode(t.note))
      note.appendChild(document.createElement('br'))
      note.appendChild(document.createTextNode(t.soon))

      // Automatyczna proba otwarcia aplikacji (jesli zainstalowana)
      if (/android|iphone|ipad/i.test(navigator.userAgent)) {
        setTimeout(function () { location.href = deepLink }, 400)
      }
    })()
  </script>
</body>
</html>
